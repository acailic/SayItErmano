[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sayit-ermano"
version = "0.7.0"
description = "SayItErmano - local voice dictation with AI polish for Linux (community port of altic-dev/FluidVoice behavior)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "SayItErmano contributors" }]
keywords = ["speech-to-text", "dictation", "whisper", "voice", "linux"]
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "python-xlib>=0.33",
    "pillow>=10.1",
    "faster-whisper>=1.0",
]

[project.urls]
Homepage = "https://github.com/acailic/SayItErmano"
Issues = "https://github.com/acailic/SayItErmano/issues"
Releases = "https://github.com/acailic/SayItErmano/releases"

[project.optional-dependencies]
torch = ["openai-whisper"]          # only if you want the torch/CUDA backend
# CPU wheel; the CUDA execution provider is used automatically when the
# installed wheel provides it — no separate onnxruntime-gpu extra.
parakeet = ["onnxruntime>=1.17"]
# Wayland push-to-talk (hotkey.wayland_evdev): reads /dev/input via
# python-evdev — a privileged path (input group). Insertion itself needs
# the system tools wtype/ydotool/wl-clipboard, not this extra.
wayland = ["evdev>=1.6"]
dev = ["pytest>=8"]

[project.scripts]
sayit-ermano = "fluidvoice.cli:main"
fluidvoice = "fluidvoice.cli:main"  # legacy alias from the pre-rename installs

[tool.setuptools.packages.find]
include = ["fluidvoice*"]

[tool.setuptools.package-data]
"fluidvoice" = ["assets/sfx/*", "assets/icon.png",
                "assets/icons/*", "assets/icons/symbolic/actions/*.svg", "assets/providers/*"]

[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')", "integration: real-subsystem tests (mic, GPU, daemon process, network)", "desktop: live-interactive-session tests (X grabs, screen pixels) - excluded from default runs"]
