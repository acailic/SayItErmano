[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sayit-ermano"
version = "0.8.1"
description = "SayItErmano - local voice dictation with AI polish for Linux (community port of altic-dev/FluidVoice behavior)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "SayItErmano contributors" }]
keywords = ["speech-to-text", "dictation", "whisper", "voice", "linux"]
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "python-xlib>=0.33",
    "pillow>=10.1",
    "faster-whisper>=1.0",
]

[project.urls]
Homepage = "https://github.com/acailic/SayItErmano"
Issues = "https://github.com/acailic/SayItErmano/issues"
Releases = "https://github.com/acailic/SayItErmano/releases"

[project.optional-dependencies]
torch = ["openai-whisper"]          # only if you want the torch/CUDA backend
# CPU wheel; the CUDA execution provider is used automatically when the
# installed wheel provides it — no separate onnxruntime-gpu extra.
parakeet = ["onnxruntime>=1.17"]
# Wayland push-to-talk (hotkey.wayland_evdev): reads /dev/input via
# python-evdev — a privileged path (input group). Insertion itself needs
# the system tools wtype/ydotool/wl-clipboard, not this extra.
wayland = ["evdev>=1.6"]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.5",  # parallel suite: just test-parallel (auto workers)
    "pytest-timeout>=2.3",  # bounded per-test timeout in the gate (Q1)
    "pytest-cov>=5",      # branch coverage baseline/ratchet (Q5)
    "hypothesis>=6",      # property tests at pure boundaries (Q5)
    "mypy>=1.10",         # focused typing at the seam modules (Q12)
    "ruff>=0.4",           # lint gate: just lint / ruff check .
]

[project.scripts]
sayit-ermano = "fluidvoice.cli:main"
fluidvoice = "fluidvoice.cli:main"  # legacy alias from the pre-rename installs

[tool.setuptools.packages.find]
include = ["fluidvoice*"]

[tool.setuptools.package-data]
"fluidvoice" = ["assets/sfx/*", "assets/icon.png",
                "assets/icons/*", "assets/icons/symbolic/actions/*.svg", "assets/providers/*"]
"fluidvoice.evalharness.corpus" = ["manifest.toml"]  # synthetic eval corpus (P1.4)

# Parallel runs: pytest-xdist is part of the dev setup - run the suite with
# `... -m pytest -n auto tests --ignore=tests/integration` for a ~4-5x
# speedup (1759 tests: ~69 s serial -> ~15 s on 16 workers). Intentionally
# NOT an addopts default: plain pytest stays single-process for debugging
# (--pdb, breakpoints, -x); the GTK tests need no special scoping under
# workers (each worker is its own process + XDG-isolated conftest).
[tool.pytest.ini_options]
# Bare `pytest` collects only the application suite — adws/*_test.py are
# agent-factory scripts with their own deps (pydantic) and no place in a
# pytest run (plan P0.5). Integration tests still need --ignore (they use
# the real model/mic/GPU).
testpaths = ["tests"]
# Tier marker model (Q1): `slow`/`integration`/`desktop` describe WHERE a
# test lives; the needs_* markers declare ENVIRONMENTAL REQUIREMENTS so
# selection never depends on what the dev machine happens to have. The
# unit/contract gate deselects all needs_* markers; each needs_* tier has
# its own canonical command (justfile) and, where provisioned, a CI lane.
# --strict-markers (gate + CI) makes an unregistered marker a hard error.
markers = [
    "slow: duration-only hint (never a stand-in for environmental requirements)",
    "integration: real-subsystem tests (mic, GPU, daemon process, network)",
    "desktop: live-interactive-session tests (X grabs, screen pixels) - excluded from default runs",
    "needs_model: loads/downloads a real speech model (tiny..large-v3, Parakeet)",
    "needs_network: outbound network beyond loopback fake servers",
    "needs_display: real display server + GTK4/libadwaita (Xvfb counts)",
]
# P0.4 reliability gate: an unhandled exception in ANY thread the suite
# spawned (timers, monitors, drain threads) fails the run instead of
# surfacing as a pass-with-warning. The first-PCM timer leak this caught:
# daemon.py left threading.Timer callbacks firing after their take died.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

# Current ruff layout: linter options live under [tool.ruff.lint] (the
# top-level `select`/`ignore` keys are deprecated). Minimal, deliberately:
# the house style keeps broad try/excepts on best-effort paths (preview,
# tray, doctor) - blind-except style rules would flood. Import order +
# unused imports only, for now.
[tool.ruff]
line-length = 88
target-version = "py311"  # matches requires-python ">=3.11" (F10): the
# only automated 3.11 guard — py312 here would let 3.12-only syntax
# (PEP 695, f-string grammar changes) sail past lint into 3.11 users

# Ruff scope (Q12): import order + the correctness-focused Pyflakes
# subset with the observed backlog FIXED: unused imports (F401),
# placeholderless f-strings (F541), literal `is` comparisons (F632),
# unused locals (F841). The remaining Pyflakes codes stay a later
# ratchet: F811 (redefined-while-unused) has 134 sites of deliberate
# test-double redefinitions in tests/ and vendored .claude templates —
# and zero in production code — so enabling it now would flood without
# buying correctness. adws/** and .claude/** are vendored SSSF factory
# assets, exempt from the new codes so template updates don't churn.
[tool.ruff.lint]
select = ["I001", "F401", "F541", "F632", "F841"]

[tool.ruff.lint.per-file-ignores]
"adws/**" = ["F541", "F632", "F841"]
".claude/**" = ["F541", "F632", "F841"]

# Branch coverage for the Q5 baseline/ratchet: `just coverage` (unit
# tier) and CI's unit job write XML here; tiers are measured separately
# so a tier's numbers never inflate another's (unit tier alone is the
# ratchet denominator for now).
[tool.coverage.run]
branch = true
source = ["fluidvoice"]

[tool.coverage.report]
skip_empty = true

# Focused type checking (Q12): the typed SEAM modules only — backend
# contract, task runtime, chunk reconciliation, and the release/lock
# tooling. Deliberately NOT repo-wide (no mass ignores, no rewrite);
# imported modules are followed silently so their untyped bodies don't
# flood. Grow `files` as more modules get honest annotations.
[tool.mypy]
python_version = "3.11"
files = [
    "fluidvoice/backends/base.py",
    "fluidvoice/runtime_tasks.py",
    "fluidvoice/chunking.py",
    "packaging/deb/locklib.py",
    "scripts/release_verify.py",
]
follow_imports = "silent"
warn_unused_ignores = true
