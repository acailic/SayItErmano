name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you file:** run `sayit-ermano doctor` — it diagnoses most
        audio, hotkey, insertion, and model problems and often prints the
        fix. Also skim the
        [troubleshooting FAQ](https://github.com/acailic/SayItErmano/blob/linux/docs/dev/FAQ.md)
        — 16 common problems with concrete fixes.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A short description of the misbehavior. One problem per issue.
      placeholder: Dictation ends but no text appears in Firefox.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Right Ctrl, say a sentence, release.
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `sayit-ermano --version`
      placeholder: 0.8.3
    validations:
      required: true
  - type: dropdown
    id: distro
    attributes:
      label: Distribution
      options:
        - Ubuntu 24.04
        - Ubuntu (other)
        - Pop!_OS
        - Fedora
        - Arch / AUR
        - Debian
        - openSUSE
        - Other (say which in the description)
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session type
      description: '`echo $XDG_SESSION_TYPE` says x11 or wayland.'
      options:
        - X11
        - GNOME Wayland
        - KDE Plasma Wayland
        - sway / Hyprland / other wlroots
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: gpu
    attributes:
      label: GPU situation
      options:
        - NVIDIA, CUDA in use (doctor shows GPU yes)
        - NVIDIA, CPU fallback
        - AMD / Intel (CPU int8)
        - Not sure
    validations:
      required: false
  - type: textarea
    id: doctor
    attributes:
      label: "`sayit-ermano doctor` output"
      description: |
        The app ships no telemetry — this output is how we see your
        machine. Redact anything you want; keep the tool matrix and
        session lines.
        Run: `sayit-ermano doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Journal excerpt (optional)
      description: |
        If the daemon misbehaved: `journalctl --user -u sayit-ermano -b --no-pager | tail -50`
      render: text
    validations:
      required: false
