name: release-publish

# Release step 2 of 2 (plan P0.5 + quality plan Q4). Manual only, like
# every workflow in this repo. NEVER tags or uploads on its own: every
# gate below must pass first.
#
# Gates, in order:
#   1. the release SHA is the current tip of `linux` (no stale releases)
#   2. clean checkout; version agreement: input == pyproject == package
#   3. a completed, successful CI run whose head_sha IS the release SHA
#   4. the intended release-prepare run: correct workflow, SUCCESS, and
#      head_sha == the PARENT of the release SHA (prepare checks out the
#      pre-bump head and pushes the bump commit afterwards — its head_sha
#      can never equal the release SHA; the old gate compared exactly
#      those and proved nothing)
#   5. the artifact is resolved BY THAT RUN ID (never by name/index):
#      a same-version artifact from a stale or foreign run is rejected
#   6. the manifest the prepare run uploaded beside the deb re-verifies
#      the whole chain: deb sha256/size/control == manifest, the
#      tracked-source digest of THIS checkout == the digest of the tree
#      the deb was built from, and the dependency lock sha256 matches
#      (scripts/release_verify.py — unit-tested in
#      tests/test_release_verify.py)
#   7. dependency-lock freshness via the shared locklib pins-coverage
#   8. REQUIRED EVIDENCE: the `evidence` input must record what was
#      verified against this artifact (install smoke / desktop matrix /
#      eval report) and quote the deb sha256 from the prepare summary,
#      or carry an explicit `EVIDENCE-SKIP: <why>` waiver — empty or
#      unbound evidence fails the release; nothing is silently skipped
#   9. tag v<version> does not exist yet
# Only then: push the tag and create the GitHub release with the deb.
#
# Full flow: docs/dev/release-gates.md
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version being published (must match release-prepare)"
        required: true
        type: string
      sha:
        description: "Release SHA (the version-bump commit release-prepare pushed; short or full)"
        required: true
        type: string
      evidence:
        description: "What was verified against this artifact (install smoke, desktop matrix, eval) — must quote the deb sha256 from the prepare summary, or 'EVIDENCE-SKIP: <why>'"
        required: true
        type: string
      notes:
        description: "Release notes (optional; default: the [Unreleased] section of CHANGELOG.md)"
        required: false
        type: string

permissions:
  contents: write # tag + release upload
  actions: read  # verify the CI run + fetch the prepare artifact

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    name: "verify gates + tag + upload (v${{ inputs.version }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ inputs.version }}
      SHA_IN: ${{ inputs.sha }}
      EVIDENCE_IN: ${{ inputs.evidence }}
      NOTES_IN: ${{ inputs.notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: linux
          fetch-depth: 0

      - name: Release SHA is the tip of linux; clean checkout
        run: |
          set -euo pipefail
          TIP="$(git rev-parse origin/linux)"
          case "$TIP" in
              "$SHA_IN"*) ;; # full sha or unambiguous short form
              *)
                  echo "ERROR: input SHA ${SHA_IN} is not the tip of origin/linux (${TIP})." >&2
                  echo "       Releases publish the branch head; re-run prepare if the branch moved." >&2
                  exit 1 ;;
          esac
          echo "SHA=$TIP" >> "$GITHUB_ENV"
          [ -n "$(git status --porcelain)" ] && {
              echo "ERROR: dirty checkout" >&2; exit 1; }

      - name: Version agreement (input == pyproject == package)
        run: |
          set -euo pipefail
          grep -q "^version = \"${VERSION}\"" pyproject.toml || {
              echo "ERROR: pyproject.toml is not at version ${VERSION}" >&2; exit 1; }
          grep -q "^__version__ = \"${VERSION}\"" fluidvoice/__init__.py || {
              echo "ERROR: fluidvoice/__init__.py is not at version ${VERSION}" >&2; exit 1; }

      - name: Green CI on the EXACT release SHA (manual-dispatch policy)
        run: |
          set -euo pipefail
          GREEN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
              --jq '[.workflow_runs[]
                     | select(.path == ".github/workflows/ci.yml"
                              and .status == "completed"
                              and .conclusion == "success")] | length')
          if [ "${GREEN:-0}" -lt 1 ]; then
              echo "ERROR: no successful CI run for commit ${SHA}." >&2
              echo "       Dispatch CI manually on that exact commit (Actions → CI →" >&2
              echo "       Run workflow → branch linux) and wait for green first." >&2
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
                  --jq '.workflow_runs[] | "  found: \(.name) \(.status) \(.conclusion // "")"' || true
              exit 1
          fi
          echo "CI is green for ${SHA}"

      - name: Resolve the intended release-prepare run (Q4)
        # prepare's head_sha is the PARENT of the release SHA; the run
        # must be the right workflow AND successful.
        run: |
          set -euo pipefail
          PARENT_SHA="$(git rev-parse "${SHA}^")"
          echo "release SHA $SHA prepared from parent $PARENT_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" > /tmp/runs.json
          PREPARE_RUN_ID="$(python scripts/release_verify.py select-prepare-run \
              --runs-f /tmp/runs.json --parent-sha "$PARENT_SHA")"
          echo "PREPARE_RUN_ID=$PREPARE_RUN_ID" >> "$GITHUB_ENV"
          echo "release-prepare run: $PREPARE_RUN_ID (successful, head == release parent)"

      - name: Dependency-lock freshness (shared locklib check)
        run: python packaging/deb/locklib.py pins-coverage --pyproject pyproject.toml --lock packaging/deb/constraints.txt

      - name: Fetch the deb + manifest BY PREPARE RUN ID and verify provenance
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=deb-v${VERSION}" > /tmp/arts.json
          python scripts/release_verify.py select-artifact \
              --artifacts-f /tmp/arts.json --name "deb-v${VERSION}" \
              --run-id "$PREPARE_RUN_ID"
          mkdir -p dist
          ( cd dist && gh run download "$PREPARE_RUN_ID" -n "deb-v${VERSION}" )
          DEB="dist/sayit-ermano_${VERSION}-1_amd64.deb"
          MANIFEST="dist/manifest-v${VERSION}.json"
          [ -f "$DEB" ] || { echo "ERROR: expected $DEB in the artifact" >&2; ls -la dist; exit 1; }
          [ -f "$MANIFEST" ] || {
              echo "ERROR: artifact carries no manifest-v${VERSION}.json — it predates the Q4 provenance chain;" >&2
              echo "       re-run release-prepare (current workflows)." >&2; exit 1; }
          printf '%s' "$EVIDENCE_IN" > /tmp/evidence.txt
          python scripts/release_verify.py verify-publish \
              --repo . --manifest "$MANIFEST" --deb "$DEB" \
              --version "$VERSION" --evidence-file /tmp/evidence.txt
          echo "deb verified against its prepare manifest: $DEB ($(du -h "$DEB" | cut -f1))"

      - name: Tag does not exist yet
        run: |
          if git ls-remote --tags origin "v${VERSION}" | grep -q .; then
              echo "ERROR: tag v${VERSION} already exists" >&2
              exit 1
          fi

      - name: Push tag
        run: |
          git config user.name "release-publish"
          git config user.email "actions@users.noreply.github.com"
          git tag "v${VERSION}" "$SHA"
          git push origin "v${VERSION}"

      - name: GitHub release with the deb
        run: |
          set -euo pipefail
          NOTES="$(mktemp --suffix=.md)"
          if [ -n "${NOTES_IN:-}" ]; then
              printf '%s\n' "$NOTES_IN" > "$NOTES"
          else
              # default notes: whatever is pending under [Unreleased]
              awk '/^## \[Unreleased\]/{f=1;next} /^## /{f=0} f{print}' \
                  CHANGELOG.md > "$NOTES"
          fi
          [ -s "$NOTES" ] || echo "Release v${VERSION}. See CHANGELOG.md." > "$NOTES"
          gh release create "v${VERSION}" dist/*.deb \
              --repo "$GITHUB_REPOSITORY" --target "$SHA" \
              --title "v${VERSION} — $(head -1 "$NOTES" | sed 's/^#* *//')" \
              --notes-file "$NOTES"

      - name: Summary
        run: |
          {
              echo "### release-publish v${VERSION} — released"
              echo
              echo "- tag: \`v${VERSION}\` @ \`${SHA}\` (CI-verified)"
              echo "- artifact: the deb release-prepare built, verified against its"
              echo "  manifest (source digest + lock + package sha256) from prepare"
              echo "  run ${PREPARE_RUN_ID}"
              echo "- evidence on record: ${EVIDENCE_IN}"
              echo "- manual follow-ups (house style): AUR recipe bump"
              echo "  (packaging/aur), Reddit/HN post, machine refresh"
          } >> "$GITHUB_STEP_SUMMARY"
