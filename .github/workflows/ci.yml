name: CI

# Manual only: run from the Actions tab ("Run workflow" button).
on:
  workflow_dispatch:

jobs:
  unit:
    name: unit tests (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install system tools used by the code under test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xdotool xclip libnotify-bin
          # optional recorders (package name varies by release)
          sudo apt-get install -y pulseaudio-utils || true
          sudo apt-get install -y pipewire-audio-utils \
              || sudo apt-get install -y pipewire-utils || true
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Unit tests (offline)
        # testpaths is pinned to tests/ in [tool.pytest.ini_options], so bare
        # pytest no longer collects adws/*_test.py (agent-factory scripts).
        run: pytest tests -m "not slow and not integration" -q
      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-py${{ matrix.python }}
          path: |
            .pytest_cache/
          if-nothing-found: ignore

  lint-compile:
    name: compile + metadata checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint (ruff)
        # same gate as `just lint`; config in [tool.ruff.lint] (pyproject)
        run: |
          pip install ruff
          ruff check .
      - name: Byte-compile everything
        run: |
          pip install -e . pytest
          python -m compileall -q fluidvoice tests
      - name: Integration suite compiles and collects
        run: pytest --collect-only -q tests/integration
