# TTS decode-baseline reference set (wave 3, agent J).
#
# Fixed, versioned reference texts for the first real-model decode
# benchmark: piper renders each [[utterances]] text to speech, the
# production speech backend transcribes it, and the wave-2 measurement
# adapters score the round trip (docs/eval/decode-baseline-2026-09-11.md).
#
# Stratification mirrors docs/eval/corpus-spec.md §4 (T1–T6) at 1/10th
# scale — this is a TTS single-voice BASELINE, explicitly NOT the human
# corpus (that brief stays OPEN). Rules for changes: this file is
# versioned evidence; edit only by APPENDING a new utterance or bumping
# a text wholesale with a note in the report — never silently rewrite
# texts a published number depends on.
#
# tags double as the hotword vocabulary (hotword recall scores the tags
# the reference contains); T4 carries its names/numbers there per the
# corpus-spec §4 T4 convention.

