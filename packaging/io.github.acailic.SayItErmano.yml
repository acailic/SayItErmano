# SPIKE manifest (issue #10/#11, ADR-0006) — proves the sandbox input story.
# Not the shipping manifest: no metainfo/desktop/icons yet. Permissions are
# the spike set: fallback-x11 for the XGrabKey+xdotool row, plus the D-Bus
# session socket (portals) — flatpak always exposes the session bus, the
# explicit --socket=dbus is documentation here.
# GPU/model download not exercised by the spike (doctor runs model-free).
id: io.github.acailic.SayItErmano
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
command: sayit-ermano

finish-args:
  - --socket=fallback-x11      # X11 row of the ADR-0006 matrix (XGrabKey + xdotool)
  - --share=ipc                # X11 needs the ipc socket
  - --socket=pulseaudio        # PipeWire/Pulse capture (doctor mic probe)
  - --device=dri               # GPU device nodes (Vulkan path, later slices)
  - --share=network            # first-run model download (ADR-0006 baseline)
  - --env=SAYITERMANO_FLATPAK=1

modules:
  - name: sayitermano
    buildsystem: simple
    build-commands:
      # flatpak-builder's build sandbox has no network: install from the
      # local git checkout with the SDK's own setuptools (no isolation).
      - pip3 install --no-build-isolation --no-deps --prefix=/app .
    sources:
      - type: git
        url: file:///home/nistrator/Documents/github/FluidVoiceLinux-agent
        branch: linux
  - name: deps
    buildsystem: simple
    build-commands:
      # python-xlib/pillow: core deps. dbus-next + global-shortcut-portal:
      # the GlobalShortcuts portal hotkey + RemoteDesktop/EIS insertion
      # (ADR-0006; vendored wheels — the build sandbox has no network).
      - pip3 install --prefix=/app python_xlib-0.33-py2.py3-none-any.whl pillow-13.0.0-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl dbus_next-0.2.3-py3-none-any.whl global_shortcut_portal-0.1.0-py3-none-any.whl
    sources:
      - type: file
        path: wheels/python_xlib-0.33-py2.py3-none-any.whl
      - type: file
        path: wheels/pillow-13.0.0-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
      - type: file
        path: wheels/dbus_next-0.2.3-py3-none-any.whl
      - type: file
        path: wheels/global_shortcut_portal-0.1.0-py3-none-any.whl
